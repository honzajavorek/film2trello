name: docker-build-verify

# Throwaway: verifies the Dockerfile actually builds with Camoufox's Firefox
# added (system deps via apt, then camoufox fetch), without deploying to
# Fly.io. Delete once confirmed.

on:
  push:
    branches: [claude/camoufox-anubis-fix]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t film2trello-test .

      - name: Sanity-check the app starts (imports, no crash on --help)
        run: docker run --rm film2trello-test film2trello --help
