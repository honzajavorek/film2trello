name: scripts

on:
  push:
    branches:
      - main
  schedule:
      - cron: "0 0 */3 * *"  # every three days is enough

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Camoufox
        # `camoufox fetch` lists releases from 3 GitHub repos unauthenticated
        # by default; GitHub's 60 req/hour anonymous limit is routinely
        # exhausted on shared Actions runner IPs. When every repo 403s,
        # camoufox's own fetch() prints an error but does a bare `return`
        # (no sys.exit), so the step exits 0 having installed nothing - the
        # actual failure only surfaces later as CamoufoxNotInstalled, deep
        # inside Process Inbox. GITHUB_TOKEN raises the limit to 5000/hour;
        # the verify+retry stays as a safety net for anything else that
        # slips through the same silent-success gap.
        run: |
          for attempt in 1 2 3; do
            uv run camoufox fetch
            if uv run python -c "from camoufox.pkgman import installed_verstr; installed_verstr()"; then
              exit 0
            fi
            echo "camoufox fetch left no working install (attempt $attempt/3), retrying..."
            sleep 5
          done
          echo "camoufox fetch failed to leave a working install after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore film cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: film-cache-${{ github.run_id }}
          restore-keys: |
            film-cache-

      - name: Process Inbox
        run: uv run film2trello inbox
        env:
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_BOARD: ${{ secrets.TRELLO_BOARD }}

      - name: Save film cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: film-cache-${{ github.run_id }}
