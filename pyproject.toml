[project]
name = "film2trello"
version = "0.0.0"
description = "Turns film links to Trello cards 🍿"
authors = [{ name = "Honza Javorek", email = "mail@honzajavorek.cz" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-telegram-bot>=20.7",
    "click>=8.3.1",
    "httpx[http2]>=0.25",
    "lxml>=6.0.2",
    "cssselect>=1.3.0",
    "pillow>=12.1.1",
    "pytest-asyncio>=1.3.0",
    "stamina>=25.2.0",
]

[project.urls]
Repository = "https://github.com/honzajavorek/film2trello/"

[project.scripts]
film2trello = "film2trello.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = "tests"
addopts = "--ff"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"
