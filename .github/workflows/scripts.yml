name: scripts

on:
  push:
    branches:
      - main
  schedule:
      - cron: "0 0 */3 * *"  # every three days is enough

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Camoufox
        # `camoufox fetch` has occasionally reported success without
        # actually leaving a working install (finishes in ~2s instead of
        # the normal ~15-20s, then the next Camoufox launch fails with
        # CamoufoxNotInstalled). Verify the same way camoufox itself does
        # before trusting it, and retry if it didn't take.
        run: |
          for attempt in 1 2 3; do
            uv run camoufox fetch
            if uv run python -c "from camoufox.pkgman import installed_verstr; installed_verstr()"; then
              exit 0
            fi
            echo "camoufox fetch left no working install (attempt $attempt/3), retrying..."
            sleep 5
          done
          echo "camoufox fetch failed to leave a working install after 3 attempts"
          exit 1

      - name: Restore film cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: film-cache-${{ github.run_id }}
          restore-keys: |
            film-cache-

      - name: Process Inbox
        run: uv run film2trello inbox
        env:
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_BOARD: ${{ secrets.TRELLO_BOARD }}

      - name: Save film cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: film-cache-${{ github.run_id }}
