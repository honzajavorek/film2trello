name: scripts

on:
  push:
    branches:
      - main
  schedule:
      - cron: "0 0 */3 * *"  # every three days is enough

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Camoufox
        # GITHUB_TOKEN avoids the ~60/hour anonymous GitHub API rate limit
        # that was causing this step to silently fail to install anything.
        run: GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" uv run camoufox fetch

      - name: Restore film cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: film-cache-${{ github.run_id }}
          restore-keys: |
            film-cache-

      - name: Process Inbox
        run: uv run film2trello inbox
        env:
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_BOARD: ${{ secrets.TRELLO_BOARD }}

      - name: Save film cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: film-cache-${{ github.run_id }}
