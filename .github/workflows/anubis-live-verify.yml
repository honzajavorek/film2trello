name: anubis-live-verify

# Throwaway: verifies anubis.get_html() actually clears Anubis's challenge
# against real CSFD.cz and KVIFF.TV pages. Delete once confirmed.

on:
  push:
    branches: [claude/camoufox-anubis-fix]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Camoufox
        run: uv run camoufox fetch

      - name: Diagnose live fetch
        run: |
          uv run python -c "
          import asyncio
          from film2trello import anubis

          URLS = [
              'https://www.csfd.cz/film/2358-vecerni-skola/',
              'https://www.csfd.cz/',
              'https://kviff.tv/katalog/',
          ]

          async def check(url):
              print(f'=== {url} ===')
              page = await anubis.get_html(url)
              title = page['html'].cssselect('title')
              title_text = title[0].text_content().strip() if title else None
              print('final url:', page['url'])
              print('title:', title_text)
              print('is_antibot_page:', anubis.is_antibot_page(page['html']))

          async def main():
              for url in URLS:
                  await check(url)

          asyncio.run(main())
          "
