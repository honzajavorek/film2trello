name: camoufox-fetch-auth-verify

on:
  push:
    branches:
      - claude/camoufox-fetch-retry

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Camoufox (authenticated)
        run: uv run camoufox fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify install
        run: uv run python -c "from camoufox.pkgman import installed_verstr; print('Installed:', installed_verstr())"
